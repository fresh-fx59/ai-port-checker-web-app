version: '3.8'

services:
  postgres:
    environment:
      POSTGRES_DB: gemini_web_app
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    ports: []  # Don't expose ports in production

  redis:
    volumes:
      - redis_prod_data:/data
    ports: []  # Don't expose ports in production
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes

  app:
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://postgres:5432/gemini_web_app
      DATABASE_USERNAME: ${DB_USER}
      DATABASE_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
    restart: always

  # Production frontend with nginx
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gemini-frontend-prod
    ports:
      - "80:80"
    depends_on:
      - app
    restart: always

  # Nginx reverse proxy (optional)
  nginx:
    image: nginx:alpine
    container_name: gemini-nginx
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - app
      - frontend
    restart: always
    profiles:
      - nginx

volumes:
  postgres_prod_data:
    driver: local
  redis_prod_data:
    driver: local