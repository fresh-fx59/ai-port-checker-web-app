spring:
  # Development database configuration
  datasource:
    url: jdbc:postgresql://localhost:5432/gemini_web_app_dev
    username: gemini_user
    password: gemini_password
  
  # JPA configuration for development
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  
  # Redis configuration for development
  data:
    redis:
      host: localhost
      port: 6379
      password: ""
  
  # Development security settings
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID_DEV:dev-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET_DEV:dev-google-client-secret}

# Gemini API configuration for development
gemini:
  api:
    key: ${GEMINI_API_KEY_DEV:dev-gemini-api-key}
    base-url: https://generativelanguage.googleapis.com/v1beta
    model: gemini-pro
    timeout: 30s
    max-retries: 3

# Development-specific application configuration
app:
  quota:
    anonymous-requests: 1
    registered-requests: 5
  security:
    jwt:
      secret: dev-jwt-secret-key-not-for-production
      expiration: 86400000
  cors:
    allowed-origins: http://localhost:3000,http://localhost:3001
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS
    allowed-headers: "*"
    allow-credentials: true

# Development logging with colors
logging:
  level:
    com.example.geminiapp: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.web: DEBUG
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n%wEx"

# Development actuator settings
management:
  endpoints:
    web:
      exposure:
        include: "*"
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      show-components: always
    shutdown:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    web:
      server:
        request:
          autotime:
            enabled: true