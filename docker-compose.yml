version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: gemini-postgres
    environment:
      POSTGRES_DB: gemini_web_app_dev
      POSTGRES_USER: gemini_user
      POSTGRES_PASSWORD: gemini_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - gemini-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gemini_user -d gemini_web_app_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: gemini-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - gemini-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    command: redis-server --appendonly yes

  # Spring Boot Application
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gemini-app
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DATABASE_URL: jdbc:postgresql://postgres:5432/gemini_web_app_dev
      DATABASE_USERNAME: gemini_user
      DATABASE_PASSWORD: gemini_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      GEMINI_API_KEY: ${GEMINI_API_KEY:-your-gemini-api-key}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-your-google-client-id}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-your-google-client-secret}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-key-not-for-production}
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3001
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - gemini-network
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped

  # Frontend Development Server (optional for full-stack development)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: gemini-frontend
    environment:
      REACT_APP_API_BASE_URL: http://localhost:8080/api
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - gemini-network
    depends_on:
      - app
    profiles:
      - frontend

networks:
  gemini-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local